name: Self test

# Lints the workflows and the shell scripts of this repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh
